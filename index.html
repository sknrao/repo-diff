<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Combined Reports Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono&display=swap');
  
  :root {
    --bg: #0b0f1a;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #1f2d44;
    --accent: #22d3a5;
    --text: #e2e8f0;
    --dim: #64748b;
    --head: 'Syne', sans-serif;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body, html {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--head);
    overflow: hidden; /* Hide scrollbars in the main window */
    display: flex;
    flex-direction: column;
  }
  
  /* Top Navigation Bar */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(11, 15, 26, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    z-index: 100;
    flex-shrink: 0;
  }
  
  .tabs {
    display: flex;
    gap: 8px;
    background: var(--surface);
    padding: 6px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  
  .tab-button {
    background: transparent;
    border: none;
    color: var(--dim);
    font-family: var(--head);
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 10px 24px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .tab-button:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.05);
  }
  
  .tab-button.active {
    color: var(--bg);
    background: var(--accent);
    box-shadow: 0 4px 12px rgba(34, 211, 165, 0.3);
  }
  
  /* Iframe Container */
  .iframe-container {
    position: relative;
    flex-grow: 1;
    width: 100%;
    background: var(--bg);
  }
  
  iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease-in-out;
  }
  
  iframe.active {
    opacity: 1;
    pointer-events: auto;
  }
  
</style>
</head>
<body>

  <!-- Navigation -->
  <div class="navbar">
    <div class="tabs">
      <button class="tab-button active" onclick="switchTab('loc')">LOC-NEW</button>
      <button class="tab-button" onclick="switchTab('upstream')">UPSTREAM</button>
    </div>
  </div>

  <!-- Content -->
  <div class="iframe-container">
    <iframe id="iframe-loc" src="loc_report.html" class="active"></iframe>
    <iframe id="iframe-upstream" src="index-old.html"></iframe>
  </div>

  <script>
    function switchTab(tabId) {
      // Update buttons
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      
      // Update iframes
      document.getElementById('iframe-loc').classList.remove('active');
      document.getElementById('iframe-upstream').classList.remove('active');
      
      if (tabId === 'loc') {
        document.getElementById('iframe-loc').classList.add('active');
      } else {
        document.getElementById('iframe-upstream').classList.add('active');
      }
    }
  </script>
</body>
</html>
