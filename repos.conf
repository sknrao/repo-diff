# ──────────────────────────────────────────────────────────────────────────────
# repos.conf  —  Repository pairs for run_all_diffs.sh
#
# FORMAT — one repo pair per non-blank, non-comment line.
# Columns are separated by whitespace (spaces or tabs).
#
#   CURRENT_URL  UPSTREAM_URL  [REF]
#   CURRENT_URL  UPSTREAM_URL  [CURRENT_REF  UPSTREAM_REF]
#
# REF can be any git ref:
#   branch name  →  master, main, develop
#   tag          →  2.3.0, jakarta-release, v2023.11   ← recommended for upstream
#   commit SHA   →  a3f9c21  (full or short SHA)
#
# Column count:
#   2 columns  → both sides use the default ref (--ref flag, default: master)
#   3 columns  → both sides use the same ref
#   4 columns  → each side uses its own ref (most flexible)
#
# Lines starting with # are ignored.
# ──────────────────────────────────────────────────────────────────────────────

# Same ref both sides (branch name)
https://github.com/your-org/ccsdk-oran        https://github.com/onap/ccsdk-oran        master

# Your fork on a feature branch, upstream pinned to a release tag
https://github.com/your-org/ccsdk-features    https://github.com/onap/ccsdk-features    my-netconf-fix    2.3.0

# Upstream pinned to a specific commit SHA
https://github.com/your-org/ccsdk-sli-core    https://github.com/onap/ccsdk-sli-core    main              a3f9c21d

# Both sides use the same release tag (useful when you've also tagged your fork)
https://github.com/your-org/ccsdk-apps        https://github.com/onap/ccsdk-apps        jakarta-release
